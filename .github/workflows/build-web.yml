name: Build Web Docker image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "db/**"
      # The offline app is bundled into the image (routes/offline.ts imports it
      # with ?raw), so a change there must trigger a build too. Without this a
      # standalone-only fix silently never reached a deployment.
      - "standalone/**"
      - ".github/workflows/build-web.yml"
      - "Dockerfile.web"
      - "docker/**"
      - "tools/test_bootstrap.py"
      - "package.json"
      - "bun.lock*"
      - "yarn.lock*"
      - "package-lock.json*"
      - "pnpm-lock.yaml*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/tachograph-cards-web

jobs:
  bootstrap-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: tdh-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test bootstrap and legacy upgrades
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: tdh-ci-test-only
        run: python3 tools/test_bootstrap.py

  build-and-push:
    needs: bootstrap-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
