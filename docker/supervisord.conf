[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:postgres]
; Resolve the actual postgres binary (entrypoint uses the same find).
command=/bin/sh -c 'exec "$(find /usr/lib/postgresql -name postgres -type f | head -1)" -D /var/lib/postgresql/data'
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err
priority=10

[program:webapp]
; Nitro node-server bundle. PORT/SSL/DB env come from the container env.
command=node /app/.output/server/index.mjs
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/webapp.log
stderr_logfile=/var/log/supervisor/webapp.err
priority=20
