[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:postgres]
; Resolve the actual postgres binary (entrypoint uses the same find).
command=/bin/sh -c 'exec "$(find /usr/lib/postgresql -name postgres -type f | head -1)" -D /var/lib/postgresql/data -c unix_socket_permissions=0770'
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err
priority=10

[program:webapp]
; Nitro node-server bundle. PORT/SSL/DB env come from the container env.
command=node /app/.output/server/index.mjs
directory=/app
; v2.49: unprivileged user. Binding 443 works through the
; cap_net_bind_service file capability set on the node binary (Dockerfile.web).
user=tdhweb
environment=HOME="/tmp"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/webapp.log
stderr_logfile=/var/log/supervisor/webapp.err
priority=20

[program:warmup]
; v2.53: one request after start so the daily scheduler starts without a page
; view (see docker/warmup.mjs). Runs once, then exits.
command=node /app/docker/warmup.mjs
directory=/app
user=tdhweb
environment=HOME="/tmp"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/supervisor/warmup.log
stderr_logfile=/var/log/supervisor/warmup.err
priority=30
