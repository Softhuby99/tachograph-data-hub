[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:postgres]
; supervisord does NOT expand globs — wrap in sh so the versioned path resolves.
command=/bin/sh -c 'exec /usr/lib/postgresql/*/bin/postgres -D /var/lib/postgresql/data'
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err
priority=10

[program:webapp]
; Nitro node-server bundle. PORT/SSL/DB env come from the container env.
command=node /app/.output/server/index.mjs
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/webapp.log
stderr_logfile=/var/log/supervisor/webapp.err
priority=20
